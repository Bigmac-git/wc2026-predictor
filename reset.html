<!DOCTYPE html>
<html>
<head><title>Reset</title></head>
<body style="background:#080d0a;color:#e8f0ea;font-family:monospace;padding:40px;text-align:center;">
<h2 style="color:#C8A84B;">JSONBin Reset Tool</h2>
<p id="status">Loading keys from Gist...</p>
<button onclick="doReset()" style="background:#006847;color:#fff;font-size:18px;padding:14px 32px;border:none;cursor:pointer;margin-top:20px;">RESET ALL DATA</button>
<script src="shared.js"></script>
<script>
async function doReset() {
  document.getElementById('status').textContent = 'Resetting...';
  await ensureKeys();
  const r = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.JSONBIN_BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.JSONBIN_MASTER_KEY },
    body: JSON.stringify({ groups: {}, users: {} })
  });
  if (r.ok) {
    document.getElementById('status').textContent = '✅ Done! All data wiped. You can delete this file now.';
  } else {
    document.getElementById('status').textContent = '❌ Failed: ' + r.status;
  }
}
window.onload = () => ensureKeys().then(() => {
  document.getElementById('status').textContent = CONFIG.JSONBIN_BIN_ID ? '✅ Keys loaded. Ready to reset.' : '❌ Keys not loaded - check Gist';
});
</script>
</body>
</html>
